name: ML checks

on:
  pull_request:
  push:
    branches:
      - main
      - 4-implement-studbot-page-and-mediapipefastapi-study-pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ML tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      - name: Install native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libglib2.0-0 libportaudio2

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run unit and API contract tests
        run: uv run --locked --no-sync pytest --junitxml=test-results/unit.xml

      - name: Fetch and verify pinned model assets
        run: uv run --locked --no-sync python -m app.models.fetch

      - name: Exercise real model inference through FastAPI
        run: uv run --locked --no-sync pytest -m model_smoke --junitxml=test-results/model-smoke.xml

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ml-test-results
          path: ml/test-results/*.xml
          if-no-files-found: ignore
          retention-days: 7
