name: Web checks

on:
  pull_request:
  push:
    branches: [main, SarthakInitialSetup]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: slotty-ci-only
          POSTGRES_DB: slotty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify fresh schema, RLS and concurrent accounting
        env:
          TEST_DATABASE_URL: postgresql://postgres:slotty-ci-only@127.0.0.1:5432/slotty_test
        run: python3 scripts/test-postgres.py
      - run: npm run check
